upstream gunicorn {
  server web:8000; #web is docker service in compose.yaml. gunicorn (the service) listens on port 8000
}

server {
  listen 80;
  server_name 13.57.79.116 cappellacatalogue.com www.cappellacatalogue.com;

  return 301 https://$host$request_uri;
}

server {
  listen 443;
  server_name 13.57.79.116 cappellacatalogue.com www.cappellacatalogue.com;

  ssl_certificate /etc/nginx/certs/domainkey.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  location = /favicon.ico { #suppress warnings for not using a favicon.ico
    access_log off;
    log_not_found off;
  }

  location = / {
    return 301 /sheetmusic;
  }

  location / {
    proxy_pass http://gunicorn;
  
    proxy_set_header HOST $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_X_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    alias /app/_static/;
  }

}
